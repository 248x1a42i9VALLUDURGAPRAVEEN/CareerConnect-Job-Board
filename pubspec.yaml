
name: job_board
description: A beginner-friendly Flutter Job Board group project.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.5.6
  crypto: ^3.0.6
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/careerconnect_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/careerconnect_logo.png"
  min_sdk_android: 21
